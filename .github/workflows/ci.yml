name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gettext xvfb fakeroot
      - name: Run tests
        run: MINTCARE_SKIP_SYSTEM_TESTS=1 xvfb-run -a ./run-tests.sh
      - name: Build .deb
        run: ./build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mintcare-deb
          path: dist/*.deb
